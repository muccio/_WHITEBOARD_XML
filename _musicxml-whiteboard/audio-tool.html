<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Audio Visualizer Utility (Waveform & Sonogram)</title>
    <style>
        :root {
            --bg-color: #282c34;
            --panel-bg: #3a404c;
            --text-color: #abb2bf;
            --accent-color: #61afef;
            --border-color: #444a58;
            --green: #98c379;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 20px;
        }

        .header { text-align: center; margin-bottom: 20px; }
        
        .toolbar {
            background: var(--panel-bg);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button, input[type="file"], input[type="number"] {
            background-color: #2c313a;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 8px 15px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover { background-color: #4b5260; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-export { background-color: #445c43; color: var(--green); font-weight: bold; border-color: #5a7d59; }
        .btn-export:hover { background-color: #516d50; }

        .canvas-wrapper {
            background: #21252b;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 20px;
            overflow-x: auto; /* Permette lo scorrimento se l'immagine è molto lunga */
        }

        canvas {
            display: block;
            background: transparent; /* Fondamentale per l'esportazione */
            /* Una scacchiera leggera di sfondo solo per la UI, non finisce nel PNG */
            background-image: linear-gradient(45deg, #282c34 25%, transparent 25%), linear-gradient(-45deg, #282c34 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #282c34 75%), linear-gradient(-45deg, transparent 75%, #282c34 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        h3 { margin-top: 0; color: var(--accent-color); font-size: 16px; }

        #status { font-weight: bold; color: var(--accent-color); margin-left: auto; }
        .progress-container { width: 200px; height: 10px; background: #2c313a; border-radius: 5px; overflow: hidden; display: none; }
        .progress-bar { height: 100%; width: 0%; background: var(--accent-color); transition: width 0.1s; }
    </style>
</head>
<body>

    <div class="header">
        <h1 style="margin:0; color:#61afef;">Audio Visualizer Utility</h1>
        <p style="margin:5px 0 0 0;">Generatore di Waveform e Sonogramma esportabili con trasparenza.</p>
    </div>

    <div class="toolbar">
        <div>
            <label style="font-weight:bold; margin-right:10px;">1. Scegli Audio:</label>
            <input type="file" id="audio-input" accept=".wav, .mp3, .m4a, .ogg">
        </div>
        
        <div>
            <label title="Larghezza in pixel dell'immagine generata">Largh. Immagine (px): </label>
            <input type="number" id="img-width" value="4000" step="500" style="width: 80px;">
        </div>

        <div id="status">In attesa di file...</div>
        
        <div class="progress-container" id="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </div>

    <!-- CANVAS 1: FORMA D'ONDA -->
    <div class="canvas-wrapper">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h3>Forma d'Onda (Waveform)</h3>
            <button class="btn-export" id="export-wave" disabled>📥 Esporta Wave PNG</button>
        </div>
        <!-- Altezza di default 300px -->
        <canvas id="wave-canvas" height="300" width="4000"></canvas>
    </div>

    <!-- CANVAS 2: SONOGRAMMA -->
    <div class="canvas-wrapper">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h3>Sonogramma (Spectrogram)</h3>
            <button class="btn-export" id="export-spec" disabled>📥 Esporta Sonogramma PNG</button>
        </div>
        <!-- Altezza di default 300px -->
        <canvas id="spec-canvas" height="300" width="4000"></canvas>
    </div>

    <script>
        const audioInput = document.getElementById('audio-input');
        const imgWidthInput = document.getElementById('img-width');
        const waveCanvas = document.getElementById('wave-canvas');
        const specCanvas = document.getElementById('spec-canvas');
        const waveCtx = waveCanvas.getContext('2d', { alpha: true });
        const specCtx = specCanvas.getContext('2d', { alpha: true });
        
        const btnExportWave = document.getElementById('export-wave');
        const btnExportSpec = document.getElementById('export-spec');
        const statusText = document.getElementById('status');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');

        let audioContext = new (window.AudioContext || window.webkitAudioContext)();

        // Ascoltatore caricamento file
        audioInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            statusText.textContent = "Caricamento in memoria...";
            progressContainer.style.display = 'none';

            reader.onload = async function(ev) {
                try {
                    statusText.textContent = "Decodifica audio in corso...";
                    const audioBuffer = await audioContext.decodeAudioData(ev.target.result);
                    processAudio(audioBuffer, file.name);
                } catch (err) {
                    console.error(err);
                    statusText.textContent = "Errore decodifica audio.";
                }
            };
            reader.readAsArrayBuffer(file);
        });

        async function processAudio(audioBuffer, filename) {
            // Setup dimensioni canvas
            const width = parseInt(imgWidthInput.value) || 4000;
            waveCanvas.width = width;
            specCanvas.width = width;
            
            // Mixa a mono per semplicità visiva
            const rawData = audioBuffer.getChannelData(0); 
            const sampleRate = audioBuffer.sampleRate;

            btnExportWave.disabled = true;
            btnExportSpec.disabled = true;

            // 1. DISEGNO FORMA D'ONDA (Molto veloce)
            statusText.textContent = "Generazione Forma d'Onda...";
            await new Promise(r => setTimeout(r, 50)); // Yield alla UI
            drawWaveform(rawData, waveCanvas);
            
            // 2. DISEGNO SONOGRAMMA (Richiede computazione FFT)
            statusText.textContent = "Generazione Sonogramma...";
            progressContainer.style.display = 'block';
            await drawSpectrogramAsync(rawData, sampleRate, specCanvas);

            statusText.textContent = "Analisi completata!";
            progressContainer.style.display = 'none';

            // Abilita export e setta nomi file
            btnExportWave.disabled = false;
            btnExportSpec.disabled = false;
            
            const baseName = filename.replace(/\.[^/.]+$/, "");
            btnExportWave.onclick = () => downloadCanvas(waveCanvas, `${baseName}_waveform.png`);
            btnExportSpec.onclick = () => downloadCanvas(specCanvas, `${baseName}_sonogram.png`);
        }

        // ==========================================
        // GENERATORE WAVEFORM
        // ==========================================
        function drawWaveform(data, canvas) {
            const width = canvas.width;
            const height = canvas.height;
            const step = Math.ceil(data.length / width);
            const amp = height / 2;

            waveCtx.clearRect(0, 0, width, height);
            waveCtx.beginPath();
            waveCtx.strokeStyle = "#61afef"; // Colore onda
            waveCtx.lineWidth = 1;

            // Per ogni pixel orizzontale, trova il picco min e max in quel blocco di campioni
            for (let i = 0; i < width; i++) {
                let min = 1.0;
                let max = -1.0;
                for (let j = 0; j < step; j++) {
                    const datum = data[(i * step) + j];
                    if (datum < min) min = datum;
                    if (datum > max) max = datum;
                }
                // Disegna linea verticale per il pixel corrente
                waveCtx.moveTo(i, (1 + min) * amp);
                waveCtx.lineTo(i, (1 + max) * amp);
            }
            waveCtx.stroke();
        }

        // ==========================================
        // GENERATORE SONOGRAMMA (FFT)
        // ==========================================
        // Usiamo un processo asincrono (chunking) per non bloccare il browser
        async function drawSpectrogramAsync(data, sampleRate, canvas) {
            const width = canvas.width;
            const height = canvas.height;
            
            specCtx.clearRect(0, 0, width, height);
            
            const fftSize = 2048; // Risoluzione frequenza
            const step = Math.floor((data.length - fftSize) / width);
            
            const imageData = specCtx.createImageData(width, height);
            const pixels = imageData.data;

            // Mappatura colori stile mappa di calore (Heatmap con trasparenza sui neri)
            function getColor(val) {
                // val va da 0 (silenzio) a 255 (rumore forte)
                const ratio = val / 255;
                let r = Math.min(255, ratio * 500); // Rosso sale veloce
                let g = Math.min(255, Math.max(0, (ratio - 0.4) * 500)); // Verde dopo metà
                let b = Math.min(255, Math.max(0, (ratio - 0.7) * 500)); // Blu solo sui picchi
                let a = Math.min(255, ratio * 300); // Alpha: silenzi = trasparente!
                return [r, g, b, a];
            }

            let slice = new Float32Array(fftSize);

            for (let i = 0; i < width; i++) {
                // Estrae blocco audio
                let offset = i * step;
                for (let j = 0; j < fftSize; j++) {
                    // Finestra di Hann per smussare i bordi del blocco
                    let multiplier = 0.5 * (1 - Math.cos(2 * Math.PI * j / (fftSize - 1)));
                    slice[j] = data[offset + j] * multiplier;
                }

                // Calcola FFT (Magnitudine)
                let magnitudes = computeFFTMagnitude(slice);

                // Disegna la colonna dal basso (frequenze basse) all'alto (alte)
                // Limitiamo la visualizzazione visiva (Nyquist = sampleRate/2).
                // Di solito le informazioni utili sono fino a 10-12kHz.
                const usefulBins = Math.floor(magnitudes.length * 0.5); // Mostra metà banda

                for (let y = 0; y < height; y++) {
                    // Mappa Y del canvas (invertita) sul bin dell'FFT
                    let binIndex = Math.floor((height - 1 - y) / height * usefulBins);
                    let val = magnitudes[binIndex];
                    
                    // Normalizza per visibilità (amplifica i segnali deboli)
                    val = Math.min(255, val * 10000); 

                    let [r, g, b, a] = getColor(val);

                    let pIndex = (y * width + i) * 4;
                    pixels[pIndex] = r;
                    pixels[pIndex + 1] = g;
                    pixels[pIndex + 2] = b;
                    pixels[pIndex + 3] = a;
                }

                // Aggiorna UI ogni 50 pixel generati
                if (i % 50 === 0) {
                    progressBar.style.width = `${(i / width) * 100}%`;
                    await new Promise(r => setTimeout(r, 0)); // Evita blocco main thread
                }
            }

            specCtx.putImageData(imageData, 0, 0);
            progressBar.style.width = `100%`;
        }

        // ==========================================
        // MINI-LIBRERIA FFT (Fast Fourier Transform)
        // Implementazione Cooley-Tukey Radix-2
        // ==========================================
        function computeFFTMagnitude(realIn) {
            let n = realIn.length;
            let m = Math.log2(n);
            
            // Bit-reversal
            let real = new Float32Array(n);
            let imag = new Float32Array(n);
            
            for (let i = 0; i < n; i++) {
                let reverse = 0;
                for (let j = 0, temp = i; j < m; j++) {
                    reverse = (reverse << 1) | (temp & 1);
                    temp >>= 1;
                }
                real[reverse] = realIn[i];
            }

            // FFT
            for (let s = 1; s <= m; s++) {
                let m_half = 1 << s;
                let m_half_2 = m_half >> 1;
                let theta = -2 * Math.PI / m_half;
                let wReal = Math.cos(theta);
                let wImag = Math.sin(theta);

                for (let k = 0; k < n; k += m_half) {
                    let uReal = 1;
                    let uImag = 0;
                    for (let j = 0; j < m_half_2; j++) {
                        let tReal = uReal * real[k + j + m_half_2] - uImag * imag[k + j + m_half_2];
                        let tImag = uReal * imag[k + j + m_half_2] + uImag * real[k + j + m_half_2];
                        
                        real[k + j + m_half_2] = real[k + j] - tReal;
                        imag[k + j + m_half_2] = imag[k + j] - tImag;
                        real[k + j] += tReal;
                        imag[k + j] += tImag;
                        
                        let nextUReal = uReal * wReal - uImag * wImag;
                        uImag = uReal * wImag + uImag * wReal;
                        uReal = nextUReal;
                    }
                }
            }

            // Calcolo Magnitudine
            let magnitudes = new Float32Array(n / 2);
            for (let i = 0; i < n / 2; i++) {
                magnitudes[i] = Math.sqrt(real[i] * real[i] + imag[i] * imag[i]);
            }
            return magnitudes;
        }

        // ==========================================
        // HELPER ESPORTAZIONE
        // ==========================================
        function downloadCanvas(canvas, filename) {
            const dataUrl = canvas.toDataURL("image/png");
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

    </script>
</body>
</html>
