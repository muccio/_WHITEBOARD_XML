<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>MusicXML Whiteboard Pro - PDF Export</title>
    <meta name="theme-color" content="#282c34">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.6.1/build/opensheetmusicdisplay.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

    <!-- PANNELLO DI CONTROLLO -->
    <div class="controls-panel" id="controls">
        <!-- MANIGLIA PER IL TRASCINAMENTO -->
        <div class="drag-handle" id="main-drag-handle" title="Trascina pannello">⋮⋮</div>

        <div class="control-group">
            <input type="text" id="proj-title" placeholder="Titolo Progetto" style="width:140px; font-weight:bold;">
            <input type="text" id="proj-author" placeholder="Autore" style="width:100px;">
            <a href="manuale.html" target="_blank" title="Apri il manuale utente in una nuova scheda" class="btn-help">?</a>
        </div>

        <div class="control-group">
            <input type="file" id="file-input" accept=".xml,.musicxml,.mxl" style="max-width: 140px;"/>
        </div>
        
        <div class="control-group">
            <button id="btn-undo" class="btn-custom" title="Annulla operazione (Ctrl+Z)" disabled>↩️</button>
            <button id="btn-redo" class="btn-custom" title="Ripristina (Ctrl+Y)" disabled>↪️</button>
            <button id="save-project-btn" class="btn-custom btn-save">💾 Salva</button>
            <button id="trigger-load-btn" class="btn-custom btn-load">📂 Carica</button>
            <input type="file" id="load-project-input" accept=".json" style="display:none;" />
            <button id="export-pdf-btn" class="btn-custom" style="background:#633c41; border-color:#875158; color:#e06c75;">📄 PDF</button>
            <button id="btn-legend-edit" class="btn-custom btn-legend">🏷️ Legenda</button>
        </div>
        
        <div class="control-group">
            <strong>Strum:</strong>
            <select id="draw-tool">
                <option value="select">↖ Seleziona / Sposta</option>
                <option value="bezier">S Curva di Bézier</option>
                <option value="freehand">✎ Mano libera</option>
                <option value="line">/ Linea retta</option>
                <option value="rect">☐ Rettangolo vuoto</option>
                <option value="rectFill">■ Rettangolo pieno</option>
                <option value="circle">◯ Cerchio vuoto</option>
                <option value="fill">🪣 Secchiello (riempi)</option>
                <option value="text">T Testo</option>
                <option value="image">🖼️ Immagine PNG</option>
                <option value="eraser">⌫ Gomma (elimina)</option>
            </select>
            
            <input type="file" id="img-upload" accept="image/png" style="display:none;">

            <div id="standard-controls" style="display:flex; align-items:center; gap:5px;">
                <input type="color" id="draw-color" value="#61afef" title="Colore">
                <input type="range" id="draw-opacity" min="0.1" max="1" step="0.1" value="1" style="width: 40px;" title="Trasparenza">
                <input type="range" id="draw-size" min="1" max="20" value="4" style="width: 40px;" title="Spessore">
            </div>

            <button id="btn-delete-element" class="btn-clear" style="display:none;" title="Elimina l'elemento selezionato">🗑️</button>
            
            <label class="snap-label" title="Allinea alla griglia"><input type="checkbox" id="snap-grid"> 🧲</label>
            <label class="mirror-label" title="Specchia sull'asse centrale"><input type="checkbox" id="mirror-draw"> 🪞</label>
            <button id="clear-canvas" class="btn-custom btn-clear">Svuota Lavagna</button>
        </div>

        <div class="control-group">
            <button id="btn-zoom-out">-</button>
            <span id="zoom-val" style="display:inline-block; width: 40px; text-align:center;">100%</span>
            <button id="btn-zoom-in">+</button>
        </div>

        <div class="control-group">
            <input type="number" id="grid-sec" value="1" min="0.1" step="0.1" style="width: 45px;"> s/q
            <strong>Tot:</strong>
            <input type="number" id="total-duration" value="300" min="10" step="10" style="width: 50px;"> s
        </div>
    </div>

    <!-- PANNELLO STRUMENTI TESTO AVANZATO -->
    <div id="text-tools-panel" class="controls-panel" style="top: 65px; display: none;">
        <!-- MANIGLIA PER IL TRASCINAMENTO -->
        <div class="drag-handle" id="text-drag-handle" title="Trascina pannello">⋮⋮</div>
        
        <strong>Opzioni Testo:</strong>
        <input type="text" id="text-content" placeholder="Scrivi qui..." style="width: 200px;">
        <select id="text-font">
            <option value="sans-serif">Sans Serif</option>
            <option value="serif">Serif</option>
            <option value="monospace">Monospace</option>
            <option value="cursive">Corsivo</option>
            <option value="fantasy">Fantasy</option>
        </select>
        <input type="number" id="text-font-size" value="24" min="8" max="100" title="Grandezza Font" style="width: 50px;"> px
        
        <button id="btn-open-symbols" class="btn-custom" style="background:#4b5260;">♪ Simboli</button>
        <button id="btn-close-text-panel" class="close-btn-small" title="Chiudi pannello testo">✖</button>
    </div>

    <!-- BOX INFO E LEGENDA -->
    <div id="legend-time-box"><span class="icon-square"></span> = <span id="legend-sec-val">1</span> sec</div>
    <div id="visual-legend-box"><div class="visual-legend-title">Legenda Partitura</div><div id="visual-legend-content"></div></div>

    <!-- MODALE EDITOR LEGENDA -->
    <div id="legend-modal">
        <div class="modal-content">
            <div class="modal-header"><h3>🏷️ Gestione Legenda</h3><button class="close-btn" id="close-legend-modal">&times;</button></div>
            <div class="legend-list" id="legend-list-container"></div>
            <div class="add-legend-form">
                <select id="new-legend-type">
                    <option value="color">🎨 Colore (Significato)</option>
                    <option value="freehand">✎ Mano Libera</option>
                    <option value="line">/ Linea</option>
                    <option value="rect">■ Quadrato (Pieno)</option>
                    <option value="rectOutline">☐ Quadrato (Vuoto)</option>
                    <option value="circle">◯ Cerchio</option>
                    <option value="text">T Testo</option>
                    <option value="image">🖼️ Immagine</option>
                </select>
                <input type="color" id="new-legend-color" value="#e06c75">
                <input type="text" id="new-legend-text" placeholder="Significato..." style="flex-grow: 1;">
                <button id="btn-add-legend" class="btn-custom btn-save">+</button>
            </div>
        </div>
    </div>

    <!-- MODALE SIMBOLI MUSICALI -->
    <div id="symbols-modal">
        <div class="modal-content" style="width: 600px;">
            <div class="modal-header">
                <h3>♪ Simboli Musicali</h3>
                <button class="close-btn" id="close-symbols-modal">&times;</button>
            </div>
            <div class="symbols-container">
                <div class="symbol-category">Dinamiche</div>
                <div class="symbol-grid">
                    <button class="btn-sym" onclick="insertSymbol('ppp')">ppp</button>
                    <button class="btn-sym" onclick="insertSymbol('pp')">pp</button>
                    <button class="btn-sym" onclick="insertSymbol('p')">p</button>
                    <button class="btn-sym" onclick="insertSymbol('mp')">mp</button>
                    <button class="btn-sym" onclick="insertSymbol('mf')">mf</button>
                    <button class="btn-sym" onclick="insertSymbol('f')">f</button>
                    <button class="btn-sym" onclick="insertSymbol('ff')">ff</button>
                    <button class="btn-sym" onclick="insertSymbol('fff')">fff</button>
                    <button class="btn-sym" onclick="insertSymbol('sfz')">sfz</button>
                    <button class="btn-sym" onclick="insertSymbol('cresc.')">cresc.</button>
                    <button class="btn-sym" onclick="insertSymbol('dim.')">dim.</button>
                </div>

                <div class="symbol-category">Articolazioni & Ornamenti</div>
                <div class="symbol-grid">
                    <button class="btn-sym" onclick="insertSymbol('.')">Staccato (.)</button>
                    <button class="btn-sym" onclick="insertSymbol('>')">Accento (>)</button>
                    <button class="btn-sym" onclick="insertSymbol('-')">Tenuto (-)</button>
                    <button class="btn-sym" onclick="insertSymbol('^')">Marcato (^)</button>
                    <button class="btn-sym" onclick="insertSymbol('𝄐')">Fermata</button>
                    <button class="btn-sym" onclick="insertSymbol('tr')">Trillo</button>
                    <button class="btn-sym" onclick="insertSymbol('~')">Gruppetto</button>
                </div>

                <div class="symbol-category">Note & Pause</div>
                <div class="symbol-grid">
                    <button class="btn-sym" onclick="insertSymbol('𝅝')">Semibreve</button>
                    <button class="btn-sym" onclick="insertSymbol('𝅗𝅥')">Minima</button>
                    <button class="btn-sym" onclick="insertSymbol('𝅘𝅥')">Semiminima</button>
                    <button class="btn-sym" onclick="insertSymbol('𝅘𝅥𝅮')">Croma</button>
                    <button class="btn-sym" onclick="insertSymbol('𝅘𝅥𝅯')">Semicroma</button>
                    <button class="btn-sym" onclick="insertSymbol('𝄻')">Pausa Semibr.</button>
                    <button class="btn-sym" onclick="insertSymbol('𝄼')">Pausa Min.</button>
                    <button class="btn-sym" onclick="insertSymbol('𝄽')">Pausa Semimin.</button>
                    <button class="btn-sym" onclick="insertSymbol('𝄾')">Pausa Croma</button>
                </div>

                <div class="symbol-category">Alterazioni & Chiavi</div>
                <div class="symbol-grid">
                    <button class="btn-sym" onclick="insertSymbol('♯')">Diesis</button>
                    <button class="btn-sym" onclick="insertSymbol('♭')">Bemolle</button>
                    <button class="btn-sym" onclick="insertSymbol('♮')">Bequadro</button>
                    <button class="btn-sym" onclick="insertSymbol('𝄢')">Fa</button>
                    <button class="btn-sym" onclick="insertSymbol('𝄡')">Do</button>
                    <button class="btn-sym" onclick="insertSymbol('𝄞')">Sol</button>
                </div>
            </div>
        </div>
    </div>

    <!-- WORKSPACE -->
    <div id="workspace-wrapper">
        <div id="workspace">
            <canvas id="timeline-canvas" height="5000"></canvas>
            <svg id="draw-svg" xmlns="http://www.w3.org/2000/svg" height="5000"></svg>
            <div id="patch-gallery"></div>
        </div>
    </div>
    
    <div id="render-temp"></div>

    <script src="js/globals.js"></script>
    <script src="js/history.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/svg-engine.js"></script>
    <script src="js/musicxml.js"></script>
    <script src="js/project.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
